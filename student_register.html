<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration - ProctorAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="card wide-card">
            <h2>Student Registration</h2>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
                <div class="form-group"><label>Roll Number</label><input type="text" name="roll_no" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
                <div class="form-group"><label>Branch</label><input type="text" name="branch" required placeholder="e.g. Computer Engineering / AIML"></div>
                <div class="form-group"><label>Year</label><input type="text" name="year" required placeholder="e.g. 2nd Year"></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="/student/login">Login here</a></p>
        </div>
    </div>
</body>
</html>
