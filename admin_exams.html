<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Exams - ProctorAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <h2>Manage Exams</h2>
        <a href="/admin/dashboard" class="btn btn-secondary">Dashboard</a>
    </nav>
    <div class="container main-content">
        <a href="/admin/add-exam" class="btn btn-primary" style="margin-bottom:20px;">+ Create New Exam</a>
        <table style="width:100%; border-collapse: collapse; background:white; border-radius:8px; overflow:hidden;">
            <tr style="background:#F3F4F6; text-align:left;"><th style="padding:12px;">Title</th><th>Branch</th><th>Year</th><th>Link Code</th></tr>
            {% for exam in exams %}
                <tr style="border-bottom:1px solid #E5E7EB;">
                    <td style="padding:12px;">{{ exam.title }}</td>
                    <td>{{ exam.branch }}</td>
                    <td>{{ exam.year }}</td>
                    <td><code>{{ exam.unique_link }}</code></td>
                </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
